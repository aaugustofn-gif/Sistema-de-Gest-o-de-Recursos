{% extends "base.html" %}
{% block title %}Novo Usuário{% endblock %}
{% block content %}
<h1>Novo Usuário</h1>
<div class="panel" style="max-width:480px;">
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  {% if senha_gerada %}
    <div class="sucesso">Usuário {{ nip_criado }} criado. Senha provisória: <strong>{{ senha_gerada }}</strong></div>
  {% endif %}
  <form method="post" action="/admin/usuarios/novo">
    <label>NIP</label>
    <input type="text" name="nip" required>
    <label>Posto/Graduação</label>
    <input type="text" name="posto" required placeholder="Ex: 1T, CC, SO...">
    <label>Nome</label>
    <input type="text" name="nome" required>
    <label>Setor</label>
    <select name="setor" required>
      {% for s in setor_choices %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
    </select>
    <label>Perfil</label>
    <select name="perfil" required>
      {% for p in perfil_choices %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
    </select>
    <div style="margin-top:16px;">
      <button class="btn btn-gold" type="submit">Cadastrar</button>
      <a class="btn" href="/admin/usuarios">Voltar</a>
    </div>
  </form>
</div>
{% endblock %}
