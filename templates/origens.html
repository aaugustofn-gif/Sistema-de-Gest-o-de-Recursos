{% extends "base.html" %}
{% block title %}Origens{% endblock %}
{% block content %}
<h1>Origens de Recurso</h1>
<div class="panel" style="max-width:480px;">
  <form method="post" action="/origens/nova" style="display:flex; gap:8px; align-items:end;">
    <div style="flex:1;">
      <label>Nova origem</label>
      <input type="text" name="nome" required placeholder="Ex: Orçamento FFE 2026">
    </div>
    <button class="btn btn-gold" type="submit">Adicionar</button>
  </form>
</div>
<div class="panel">
  <table>
    <thead><tr><th>Origem</th><th>Status</th><th>Ações</th></tr></thead>
    <tbody>
      {% for o in origens %}
      <tr>
        <td>{{ o.nome }}</td>
        <td>{% if o.ativo %}<span class="badge badge-ok">Ativa</span>{% else %}<span class="badge badge-warn">Inativa</span>{% endif %}</td>
        <td>
          <form class="inline" method="post" action="/origens/{{ o.id }}/toggle">
            <button class="btn btn-sm" type="submit">{% if o.ativo %}Desativar{% else %}Reativar{% endif %}</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
