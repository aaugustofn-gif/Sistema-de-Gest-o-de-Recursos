{% extends "base.html" %}
{% block title %}Nova Demanda{% endblock %}
{% block content %}
<h1>Nova Demanda</h1>
<div class="panel" style="max-width:520px;">
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  <form method="post" action="/demandas/nova">
    <label>Descrição da despesa</label>
    <input type="text" name="descricao" required>
    <label>Quantidade</label>
    <input type="number" name="quantidade" min="1" required>
    <label>ND</label>
    <select name="nd" required>
      {% for n in nd_choices %}<option value="{{ n }}">{{ n }}</option>{% endfor %}
    </select>
    <label>Valor unitário (R$)</label>
    <input type="text" name="valor_unitario" required>
    <label>Origem desejada (sugestão — o CEM confirma na autorização)</label>
    <select name="origem_desejada_id">
      <option value="">Não informar</option>
      {% for o in origens %}<option value="{{ o.id }}">{{ o.nome }}</option>{% endfor %}
    </select>
    <label>Observações</label>
    <textarea name="observacoes" rows="3"></textarea>
    <div style="margin-top:16px;">
      <button class="btn btn-gold" type="submit">Cadastrar</button>
      <a class="btn" href="/demandas">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
