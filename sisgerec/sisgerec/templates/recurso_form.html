{% extends "base.html" %}
{% block title %}{% if recurso %}Editar{% else %}Novo{% endif %} Recurso{% endblock %}
{% block content %}
<h1>{% if recurso %}Editar Recurso{% else %}Novo Recurso{% endif %}</h1>
<div class="panel" style="max-width:480px;">
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  <form method="post" action="{% if recurso %}/recursos/{{ recurso.id }}/editar{% else %}/recursos/novo{% endif %}">
    <label>ND</label>
    <select name="nd" required>
      {% for n in nd_choices %}
        <option value="{{ n }}" {% if recurso and recurso.nd==n %}selected{% endif %}>{{ n }}</option>
      {% endfor %}
    </select>
    <label>Origem</label>
    <select name="origem_id" required>
      {% for o in origens %}
        <option value="{{ o.id }}" {% if recurso and recurso.origem_id==o.id %}selected{% endif %}>{{ o.nome }}</option>
      {% endfor %}
    </select>
    <label>Valor (R$)</label>
    <input type="text" name="valor" value="{{ recurso.valor if recurso else '' }}" required>
    <label>Observações</label>
    <textarea name="observacoes" rows="3">{{ recurso.observacoes if recurso else '' }}</textarea>
    <div style="margin-top:16px;">
      <button class="btn btn-gold" type="submit">Salvar</button>
      <a class="btn" href="/recursos">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
