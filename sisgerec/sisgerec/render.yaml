services:
  - type: web
    name: sisgerec
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SUPERADMIN_NIP
        sync: false
      - key: SUPERADMIN_SENHA
        sync: false
      - key: SUPERADMIN_POSTO
        sync: false
      - key: SUPERADMIN_NOME
        sync: false
      - key: SUPERADMIN_SETOR
        sync: false
